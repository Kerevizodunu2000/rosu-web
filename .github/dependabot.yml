version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: most malicious npm versions
    # are found and pulled within days.
    cooldown:
      default-days: 7
    groups:
      # One PR for the routine minor/patch bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TypeScript 7
      # yet, so `npm run lint` fails on it. Lift this once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
