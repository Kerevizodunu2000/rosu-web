<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
<title id="t">rosu-web</title>
<desc id="d">The Rosu brand mark with a pulsing ring and floating music notes, next to the name rosu-web and the tagline: website, docs, status and in-browser tools for Rosu.</desc>
<style>
  .bg { fill: #f4f3f9; }
  .edge { fill: none; stroke: rgba(0,0,0,.06); stroke-width: 2; }
  .glow-a { stop-color: #ff66aa; stop-opacity: .22; }
  .glow-a.g0 { stop-opacity: 0; }
  .ink { fill: #211f2b; }
  .muted { fill: #6a6a80; }
  .chip { fill: #ffffff; stroke: rgba(196,22,107,.22); stroke-width: 1.5; }
  .chip-t { fill: #c4166b; }
  .note { fill: #ff2e97; }
  .ring { fill: none; stroke: #ff2e97; stroke-width: 3; }
  .ga { stop-color: #ff2e97; } .gb { stop-color: #e0405e; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .h { font-size: 92px; font-weight: 800; letter-spacing: -3px; }
  .s { font-size: 28px; font-weight: 500; }
  .c { font-size: 18px; font-weight: 600; letter-spacing: .5px; }

  @media (prefers-color-scheme: dark) {
    .bg { fill: #121019; }
    .edge { stroke: rgba(255,255,255,.08); }
    .glow-a { stop-opacity: .28; }
    .ink { fill: #ecebf5; }
    .muted { fill: #a6a5c0; }
    .chip { fill: #1b1926; stroke: rgba(255,102,170,.3); }
    .chip-t { fill: #ff66aa; }
    .note { fill: #ff66aa; }
    .ring { stroke: #ff66aa; }
    .ga { stop-color: #ff66aa; } .gb { stop-color: #ff2e97; }
  }

  .ring { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; opacity: 0; }
  .r2 { animation-delay: 1.2s; } .r3 { animation-delay: 2.4s; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.55); opacity: 0; } }

  .float { animation: rise 7s ease-in-out infinite; opacity: 0; }
  .f2 { animation-delay: 1.4s; } .f3 { animation-delay: 2.8s; } .f4 { animation-delay: 4.2s; } .f5 { animation-delay: 5.6s; }
  @keyframes rise {
    0% { transform: translateY(40px); opacity: 0; }
    20% { opacity: .85; }
    80% { opacity: .5; }
    100% { transform: translateY(-70px); opacity: 0; }
  }

  .sweep { animation: sweep 9s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(1500px); } }

  .mark { transform-box: fill-box; transform-origin: center; animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  @media (prefers-reduced-motion: reduce) {
    .ring, .float, .sweep, .mark { animation: none; }
    .ring { opacity: 0; }
    .r1 { opacity: .35; transform: scale(1.1); }
    .float { opacity: .7; transform: none; }
    .sweep { display: none; }
  }
</style>
<defs>
  <radialGradient id="glow" cx="18%" cy="20%" r="75%">
    <stop offset="0" class="glow-a"/><stop offset="1" class="glow-a g0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="92%" cy="100%" r="55%">
    <stop offset="0" class="glow-a"/><stop offset="1" class="glow-a g0"/>
  </radialGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" class="ga"/><stop offset="1" class="gb"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff8ab5"/><stop offset="1" stop-color="#ff3d86"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff66aa" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ff66aa" stop-opacity=".14"/>
    <stop offset="1" stop-color="#ff66aa" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="1278" height="318" rx="28"/></clipPath>
  <symbol id="n1" viewBox="0 0 24 32"><ellipse cx="8" cy="26" rx="7.5" ry="5.5" transform="rotate(-20 8 26)"/><rect x="13" y="2" width="3" height="24" rx="1.5"/><path d="M14.5 2c3 4 9 5 8 12-1-4-4-5-8-6z"/></symbol>
  <symbol id="n2" viewBox="0 0 36 32"><ellipse cx="8" cy="26" rx="7" ry="5" transform="rotate(-20 8 26)"/><ellipse cx="28" cy="22" rx="7" ry="5" transform="rotate(-20 28 22)"/><rect x="13" y="4" width="3" height="22" rx="1.5"/><rect x="33" y="0" width="3" height="22" rx="1.5"/><path d="M13 4 36 0v5L13 9z"/></symbol>
</defs>

<g clip-path="url(#card)">
  <rect class="bg" width="1280" height="320"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>
  <rect class="sweep" x="0" y="0" width="420" height="320" fill="url(#shine)" transform="translate(-700 0)"/>

  <g class="note">
    <g class="float f1"><use href="#n1" x="1010" y="196" width="30" height="40"/></g>
    <g class="float f2"><use href="#n2" x="1120" y="150" width="44" height="40"/></g>
    <g class="float f3"><use href="#n1" x="1190" y="226" width="24" height="32"/></g>
    <g class="float f4"><use href="#n2" x="930" y="120" width="36" height="32"/></g>
    <g class="float f5"><use href="#n1" x="1070" y="90" width="22" height="30"/></g>
  </g>

  <circle class="ring r1" cx="176" cy="160" r="96"/>
  <circle class="ring r2" cx="176" cy="160" r="96"/>
  <circle class="ring r3" cx="176" cy="160" r="96"/>

  <g class="mark">
    <g transform="translate(96 80) scale(1.6)">
      <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#pink)"/>
      <g transform="translate(50 50) scale(0.9)">
        <path d="M0 -26 L14 -8 L0 6 L-14 -8 Z" fill="#ffffff"/>
        <path d="M0 6 L18 2 L10 22 Z" fill="#ffd0e2"/>
        <path d="M0 6 L-18 2 L-10 22 Z" fill="#ffd0e2"/>
        <path d="M0 6 L10 22 L-10 22 Z" fill="#ffb3d1"/>
        <circle cy="-6" r="5" fill="#a5175a"/>
      </g>
    </g>
  </g>

  <text x="316" y="150" class="h" fill="url(#word)">rosu<tspan class="ink">-web</tspan></text>
  <text x="320" y="198" class="s muted">Website, docs, status and in-browser tools for Rosu</text>

  <g transform="translate(320 228)">
    <rect class="chip" width="132" height="36" rx="18"/><text class="c chip-t" x="66" y="24" text-anchor="middle">EN · TR · JA</text>
    <rect class="chip" x="146" width="188" height="36" rx="18"/><text class="c chip-t" x="240" y="24" text-anchor="middle">Free &amp; open source</text>
    <rect class="chip" x="348" width="164" height="36" rx="18"/><text class="c chip-t" x="430" y="24" text-anchor="middle">GPL-3.0-or-later</text>
  </g>
</g>
<rect class="edge" x="1" y="1" width="1278" height="318" rx="28"/>
</svg>
